name: Daily Feishu summary

on:
  schedule:
    # 每天北京时间 17:30（UTC 09:30）执行
    - cron: "30 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const message = data.commit.message.replace(/\r?\n/g, " ");
            core.setOutput("commit_message", message);
            core.setOutput("commit_url", data.html_url);

      - name: Send Feishu daily summary
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          SITE_URL: https://kakanbai.github.io/ai-reports/
          COMMIT_MESSAGE: ${{ steps.summary.outputs.commit_message }}
          COMMIT_URL: ${{ steps.summary.outputs.commit_url }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "FEISHU_WEBHOOK is not configured; skipping notification."
            exit 0
          fi
          report_date=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
          payload=$(jq -nc \
            --arg text "AI Reports 每日汇总\n日期：$report_date\n站点：$SITE_URL\n最新更新：$COMMIT_MESSAGE\n提交：$COMMIT_URL" \
            '{msg_type: "text", content: {text: $text}}')
          curl --fail-with-body --request POST --header 'Content-Type: application/json' --data "$payload" "$FEISHU_WEBHOOK"
